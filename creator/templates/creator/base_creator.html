<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Creator Workspace | Vibana</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark py-3 mb-4 shadow-sm">
    <div class="container px-4 max-w-3xl">
        <a class="navbar-brand fw-bold fs-4 tracking-tight" href="{% url 'creator:portal' %}">
            🖌️ VIBANA CREATOR
        </a>

        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-secondary small d-none d-md-block">Logged in as: <strong>{{ request.user.username }}</strong></span>
            
            {% if request.user.is_superuser or request.user.is_staff %}
                <a href="{% url 'admin:index' %}" class="btn btn-sm btn-outline-warning">Admin Portal</a>
            {% endif %}
            
            <a href="{% url 'creator:logout' %}?next=/" class="btn btn-sm btn-outline-light">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        {% endfor %}
    {% endif %}

    {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
