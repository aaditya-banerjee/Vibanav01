{% extends 'store/base_store.html' %}
{% block content %}
<div class="container py-5 text-center" style="min-height: 60vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <h1 class="display-1 fw-bold text-dark mb-0">404</h1>
    <h3 class="fw-bold mb-3">Oops! You look a little lost.</h3>
    <p class="text-muted mb-4 max-w-md mx-auto">The T-shirt or page you are looking for doesn't exist, has been moved, or is temporarily out of stock.</p>
    <a href="{% url 'store:catalog' %}" class="btn btn-dark px-4 py-2">Back to the Store</a>
</div>
{% endblock %}
