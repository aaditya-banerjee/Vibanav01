{% extends 'store/base_store.html' %}
{% block content %}
<div class="container my-5 text-center">
    <div class="card shadow p-5 max-width-600 mx-auto border-success">
        <h1 class="display-4 text-success">🎉 Payment Successful!</h1>
        <p class="lead mt-3">Thank you for your order. Your payment has been securely processed.</p>
        <hr class="my-4">
        <p><strong>Order ID:</strong> #{{ order.id }}</p>
        <p><strong>Razorpay Payment ID:</strong> <code>{{ payment_id }}</code></p>
        <a href="/" class="btn btn-success btn-lg mt-4">Continue Shopping</a>
    </div>
</div>
{% endblock %}
